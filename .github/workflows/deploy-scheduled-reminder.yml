name: Deploy scheduled-service reminder to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'reminder-function/**'
      - '.github/workflows/deploy-scheduled-reminder.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: reminder-function/package-lock.json

      - name: Install function dependencies
        working-directory: reminder-function
        run: npm ci

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: reminder-function
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
