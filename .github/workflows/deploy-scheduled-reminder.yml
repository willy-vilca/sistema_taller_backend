name: Deploy scheduled-service reminder to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'reminder-function/**'
      - '.github/workflows/deploy-scheduled-reminder.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: reminder-function/package-lock.json

      - name: Install function dependencies
        working-directory: reminder-function
        run: npm ci

      - name: Log in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_FUNCTIONAPP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_FUNCTIONAPP_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_FUNCTIONAPP_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: reminder-function
          remote-build: true
