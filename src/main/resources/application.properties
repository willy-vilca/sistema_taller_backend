spring.application.name=taller-api
spring.profiles.default=local

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=${SERVER_PORT:${PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never

app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:480}

# Se activan cuando Azure Functions invoque el recordatorio diario.
app.notifications.enabled=${APP_NOTIFICATIONS_ENABLED:false}
app.notifications.internal-secret=${APP_NOTIFICATIONS_INTERNAL_SECRET:}
app.notifications.azure-communication-connection-string=${APP_NOTIFICATIONS_AZURE_COMMUNICATION_CONNECTION_STRING:}
app.notifications.sender-email=${APP_NOTIFICATIONS_SENDER_EMAIL:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
