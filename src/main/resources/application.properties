spring.application.name=taller-api
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_taller}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=${SERVER_PORT:8080}
server.error.include-message=never

app.jwt.secret=${APP_JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMmJ5dGVzIQ==}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:480}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
